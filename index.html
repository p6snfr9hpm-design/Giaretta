<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minerva">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M9 15 L13.5 5.5 L20 12 Q24 10.6 28 12 L34.5 5.5 L39 15 Q44 31 34 40.5 Q24 46.5 14 40.5 Q4 31 9 15Z' fill='%23c96442'/%3E%3Ccircle cx='17.2' cy='21' r='6.6' fill='%23fff'/%3E%3Ccircle cx='30.8' cy='21' r='6.6' fill='%23fff'/%3E%3Ccircle cx='17.8' cy='21.4' r='3.1' fill='%23222'/%3E%3Ccircle cx='30.2' cy='21.4' r='3.1' fill='%23222'/%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}html{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Minerva</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&family=DM+Serif+Display&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: chat-app shell — centered greeting + composer card when empty; conversation column with composer pinned at the bottom; structured results open in a side panel (full screen on phones) */
:root{
  --bg:#faf9f5; --surface:#ffffff; --sunk:#f0eee6; --ink:#1f1e1d; --muted:#73726c; --faint:#a19f97; --line:#e5e2d8;
  --accent:#c96442; --accent-ink:#ffffff; --accent-soft:#f6e3da; --final:#fbf3e6; --ok:#2f7d4f; --bad:#b9442f;
  --b0:#c96442; --b1:#3a7ca5; --b2:#6a8f3a; --b3:#9b5aa8; --b4:#c39021; --b5:#2f8f86;
  --shadow:0 1px 2px rgba(31,30,29,.04),0 6px 24px -8px rgba(31,30,29,.12);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302e; --sunk:#1f1e1d; --ink:#f3f1ea; --muted:#a8a69e; --faint:#7d7b74; --line:#3e3e3a;
  --accent:#d97757; --accent-ink:#1f1e1d; --accent-soft:#4a3229; --final:#3a3226; --ok:#6fcf97; --bad:#ff8f78;
  --b0:#e08463; --b1:#6fb0d8; --b2:#9cc565; --b3:#c98fd6; --b4:#e6b84e; --b5:#5fc2b8;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 28px -10px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302e; --sunk:#1f1e1d; --ink:#f3f1ea; --muted:#a8a69e; --faint:#7d7b74; --line:#3e3e3a;
  --accent:#d97757; --accent-ink:#1f1e1d; --accent-soft:#4a3229; --final:#3a3226; --ok:#6fcf97; --bad:#ff8f78;
  --b0:#e08463; --b1:#6fb0d8; --b2:#9cc565; --b3:#c98fd6; --b4:#e6b84e; --b5:#5fc2b8;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 28px -10px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within,.stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none}

.app{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.col{width:100%;max-width:740px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.top .name{font-family:var(--serif);font-size:1.15rem;font-weight:500;display:flex;align-items:center;gap:8px}
.top .name svg{width:24px;height:24px}
.grow{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:9px;padding:7px 10px;color:var(--muted);font-size:.85rem}
.tbtn:hover{background:var(--sunk);color:var(--ink)}

/* scroll area */
.scroll{flex:1;overflow-y:auto;min-height:0}
#thread{display:flex;flex-direction:column;gap:22px;padding-block:12px 24px}

/* empty state */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:20px 8vh}
.greet{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.greet svg{width:42px;height:42px;flex:none}
.greet h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sugg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.sugg button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:.86rem;color:var(--ink)}
.sugg button:hover{background:var(--surface);border-color:var(--faint)}
.sugg .g{color:var(--accent);font-family:var(--mono);font-weight:500}

/* composer */
.dock{padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.composer:focus-within{border-color:var(--faint)}
.composer textarea{border:0;background:transparent;resize:none;font:inherit;font-size:1rem;color:var(--ink);padding:2px 4px;max-height:200px;outline:none;line-height:1.45}
.composer textarea::placeholder{color:var(--faint)}
.crow{display:flex;align-items:center;gap:6px}
.cbtn{display:flex;align-items:center;gap:6px;height:34px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:0 10px;font-size:.84rem;color:var(--muted);position:relative}
.cbtn:hover{background:var(--sunk);color:var(--ink)}
.cbtn.sq{width:34px;padding:0;justify-content:center}
.cbtn input{position:absolute;opacity:0;width:1px;height:1px}
.cbtn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.cbtn select{border:0;background:transparent;font:inherit;color:inherit;padding:0;cursor:pointer;outline:none}
.go{margin-left:auto;width:34px;height:34px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.go:disabled{opacity:.4;cursor:default}
.go.stop{background:var(--ink);color:var(--bg)}
.attach{display:flex;align-items:center;gap:8px}
.attach .ph{position:relative}
.attach img{height:56px;width:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.attach button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:.75rem;line-height:1}
.hint{text-align:center;color:var(--faint);font-size:.74rem;margin-top:8px}

/* tools menu */
.menu{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;width:min(300px,calc(100vw - 32px));max-height:min(420px,60vh);overflow-y:auto}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px}
.menu button:hover,.menu button[aria-checked="true"]{background:var(--sunk)}
.menu .g{width:22px;text-align:center;color:var(--accent);font-family:var(--mono)}
.menu b{display:block;font-weight:500;font-size:.9rem}
.menu span span{color:var(--muted);font-size:.78rem}

/* messages */
.msg{min-width:0;overflow-wrap:anywhere}
.user{align-self:flex-end;max-width:85%;background:var(--sunk);border-radius:16px;padding:10px 14px;white-space:pre-wrap;font-size:.98rem}
.user img{display:block;max-width:240px;border-radius:10px;margin-bottom:8px}
.user .tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;color:var(--accent);font-weight:600;margin-bottom:4px}
.bot{align-self:stretch}
.prose{font-family:var(--serif);font-size:1.06rem;line-height:1.65}
.prose p{margin:0 0 .8em}.prose>*:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:.2em 0 .9em;padding-left:1.4em}.prose li{margin:.25em 0}
.prose h3{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:1.1em 0 .35em}
.prose h3:first-child{margin-top:0}
.prose b{font-weight:600}
.prose code{font-family:var(--mono);font-size:.82em;background:var(--sunk);padding:1px 6px;border-radius:5px}
.prose pre{background:var(--sunk);padding:12px 14px;border-radius:10px;overflow-x:auto;font-family:var(--mono);font-size:.82rem;line-height:1.5}
.prose .final{font-family:var(--sans);font-size:1rem;font-weight:600;background:var(--final);border-left:3px solid var(--accent);padding:10px 14px;border-radius:4px 10px 10px 4px;margin:0 0 1em}
.think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.92rem}
.spark{width:26px;height:26px}
@media (prefers-reduced-motion:no-preference){.spark{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(.86) rotate(-8deg);opacity:.7}}}
.mark{display:block;width:26px;height:26px;margin-top:10px}
.tools-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px}
.ib{display:flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:8px;padding:6px 8px;color:var(--muted);font-size:.8rem}
.ib:hover{background:var(--sunk);color:var(--ink)}
.follow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.follow button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--ink)}
.follow button:hover{background:var(--surface);border-color:var(--faint)}
.err{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 7%,transparent);border-radius:12px;padding:10px 12px;font-size:.9rem}
.err button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:.84rem}
.err small{color:var(--faint);font-family:var(--mono);font-size:.72rem}

/* artifact card in thread */
.acard{display:flex;align-items:center;gap:12px;width:100%;max-width:440px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.acard:hover{border-color:var(--faint)}
.acard .ic{width:44px;height:44px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);color:var(--accent);font-size:1.15rem;flex:none}
.acard b{display:block;font-weight:500;font-size:.95rem;line-height:1.3}
.acard span span{color:var(--muted);font-size:.8rem}
.acard .open{margin-left:auto;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 9px;flex:none}
.acard .mini-ic{width:88px;height:auto;aspect-ratio:16/9;padding:0;overflow:hidden;background:none}
.acard .mini-ic .mini{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.intro{margin-bottom:10px}

/* side panel */
.panel{width:min(58vw,920px);flex:none;height:100%;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line)}
.panel[hidden]{display:none!important}
.phead{display:flex;align-items:center;gap:6px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px 14px;border-bottom:1px solid var(--line)}
.phead .ttl{flex:1;min-width:0}
.phead b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead small{color:var(--muted);font-size:.78rem}
.pbody{flex:1;overflow-y:auto;padding:20px max(18px,env(safe-area-inset-right,0px)) 28px max(18px,env(safe-area-inset-left,0px))}
.primary{display:flex;align-items:center;gap:6px;border:0;background:var(--ink);color:var(--bg);border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:500}
.primary:disabled{opacity:.6;cursor:default}
@media (max-width:860px){
  .panel{position:fixed;inset:0;width:100%;z-index:40;border-left:0;padding-top:env(safe-area-inset-top,0px)}
}
.ptitle{font-family:var(--serif);font-weight:500;font-size:1.55rem;line-height:1.2;margin:0 0 4px;text-wrap:balance}
.psub{color:var(--muted);margin:0 0 18px}

/* mind map */
.map-root{text-align:center;margin:0 auto 4px;max-width:560px}
.map-root .ptitle{font-size:1.7rem}
.stem{width:2px;height:20px;background:var(--line);margin:0 auto}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;border-top:2px solid var(--line);padding-top:18px}
.branch{--c:var(--b0);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface));border-radius:14px;padding:14px;min-width:0}
.branch h4{margin:0 0 10px;font-size:.98rem;font-weight:600;display:flex;align-items:center;gap:8px}
.branch h4 i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.branch ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.branch li{border-left:2px solid var(--c);padding-left:10px;font-size:.9rem;line-height:1.35;font-weight:500}
.branch li span{display:block;font-weight:400;color:var(--muted);font-size:.82rem;margin-top:1px}

/* slides — each deck carries its own theme (fixed palette per theme, independent of the page theme) */
.deckwrap{display:flex;flex-direction:column;gap:12px}
.themes{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sw{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px 5px 6px;font-size:.8rem}
.sw i{width:22px;height:22px;border-radius:6px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.stage{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--sb)}
.stage.present{cursor:pointer;user-select:none}
.stage.editing{outline:2px dashed var(--accent);outline-offset:3px}
.stage:fullscreen{border-radius:0;border:0;aspect-ratio:auto;display:grid;place-items:center;background:#000}
.stage:fullscreen .slide{position:relative;inset:auto;width:min(100vw,177.78vh);aspect-ratio:16/9}
.slide{position:absolute;inset:0;overflow:hidden;padding:6cqw 7cqw 5cqw;display:flex;flex-direction:column;gap:2.2cqw;background:var(--sb);color:var(--sf);font-family:var(--sfb);isolation:isolate}
.slide .decor{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(42cqw 42cqw at 104% -6%,color-mix(in srgb,var(--sa) 22%,transparent),transparent 70%),radial-gradient(30cqw 30cqw at -8% 112%,color-mix(in srgb,var(--s2) 14%,transparent),transparent 70%)}
.slide [contenteditable="true"]{outline:1px dashed color-mix(in srgb,var(--sa) 60%,transparent);outline-offset:.4cqw;border-radius:.4cqw;cursor:text}
.k{font-size:1.35cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--sa);font-weight:700}
.t{font-family:var(--sfh);font-weight:var(--sfw);font-size:4.2cqw;line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
.st{font-size:2.1cqw;color:var(--sm);margin:0;line-height:1.4}
.bl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1.5cqw;font-size:2.2cqw;line-height:1.35}
.bl li{display:flex;gap:1.6cqw;align-items:baseline}
.bl li::before{content:"";flex:none;width:1.1cqw;height:1.1cqw;border-radius:.3cqw;background:var(--sa);transform:translateY(-.15cqw)}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:1.2cqw;color:var(--sm);letter-spacing:.04em}
.ico{display:block;width:100%;height:100%}
.row{display:flex;gap:4cqw;align-items:center;flex:1;min-height:0}
.row>.grow{flex:1;min-width:0}
.medal{flex:none;width:22cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--sa) 14%,var(--sc));color:var(--sa);padding:5.5cqw}
/* cover */
.slide.cover{justify-content:center;gap:2.4cqw}
.slide.cover .t{font-size:6.2cqw;max-width:70%}
.slide.cover .st{font-size:2.5cqw;max-width:62%}
.slide.cover .bar{width:8cqw;height:.6cqw;border-radius:1cqw;background:var(--sa)}
.slide.cover .medal{position:absolute;right:7cqw;top:50%;transform:translateY(-50%);width:24cqw}
/* section */
.slide.section{justify-content:center}
.slide.section .num{font-family:var(--sfh);font-size:13cqw;line-height:.9;color:var(--sa)}
.slide.section .t{font-size:5.6cqw;max-width:80%}
/* cards */
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2cqw;flex:1;min-height:0;align-items:stretch}
.card{background:var(--sc);border-radius:1.6cqw;padding:2.4cqw;display:flex;flex-direction:column;gap:1cqw;min-width:0}
.card .ci{width:4.4cqw;height:4.4cqw;color:var(--sa);margin-bottom:.6cqw}
.card b{font-size:2.05cqw;line-height:1.2}
.card p{margin:0;font-size:1.6cqw;line-height:1.4;color:var(--sm)}
/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;flex:1;min-height:0}
.cmp>div{background:var(--sc);border-radius:1.6cqw;padding:2.6cqw;border-top:.6cqw solid var(--sa);min-width:0}
.cmp>div+div{border-top-color:var(--s2)}
.cmp h5{margin:0 0 1.4cqw;font-size:2.3cqw}
.cmp .bl{font-size:1.9cqw}
/* stats */
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3cqw;flex:1;align-items:center}
.stat .v{font-family:var(--sfh);font-size:9cqw;line-height:1;color:var(--sa);letter-spacing:-.02em}
.stat:nth-child(2) .v{color:var(--s2)}
.stat .l{font-size:1.9cqw;color:var(--sm);margin-top:1cqw;line-height:1.35}
/* steps */
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2cqw;flex:1;position:relative;padding-top:1cqw}
.steps::before{content:"";position:absolute;left:2.5cqw;right:2.5cqw;top:3.5cqw;height:.3cqw;background:color-mix(in srgb,var(--sa) 40%,transparent)}
.step{position:relative;display:flex;flex-direction:column;gap:1cqw;min-width:0}
.step .n{width:5cqw;height:5cqw;border-radius:50%;display:grid;place-items:center;background:var(--sa);color:var(--sb);font-weight:700;font-size:2cqw}
.step b{font-size:2cqw;line-height:1.2;margin-top:.8cqw}
.step p{margin:0;font-size:1.55cqw;line-height:1.4;color:var(--sm)}
/* chart */
.chart{flex:1;display:flex;align-items:flex-end;gap:2cqw;min-height:0;border-bottom:.25cqw solid color-mix(in srgb,var(--sf) 25%,transparent);padding-top:3cqw}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .bar{width:70%;background:linear-gradient(var(--sa),color-mix(in srgb,var(--sa) 70%,var(--s2)));border-radius:.8cqw .8cqw 0 0;min-height:.5cqw}
.chart .val{font-size:1.7cqw;font-weight:700;margin-bottom:.6cqw}
.chartlabels{display:flex;gap:2cqw}
.chartlabels span{flex:1;text-align:center;font-size:1.45cqw;color:var(--sm);line-height:1.25;min-width:0}
/* quote */
.slide.quote{justify-content:center}

async function discoverModels(key){
  const r=await fetch(API+"models?pageSize=200&key="+encodeURIComponent(key));
  if(!r.ok)throw{code:r.status===400||r.status===403?"bad_key":"upstream_error"};
  const j=await r.json();const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
  const ok=arr(j.models).filter(m=>arr(m.supportedGenerationMethods).includes("generateContent")).map(m=>m.name.replace("models/",""))
    .filter(n=>/^gemini-\d+(\.\d+)?-flash(-lite)?(-latest)?$/.test(n)).sort((a,b)=>ver(b)-ver(a));
  const main=ok.find(n=>!n.includes("lite")),lite=ok.find(n=>n.includes("lite"))||main;
  if(main){LS.set("minerva_m_main",main);LS.set("minerva_m_lite",lite)}
  return {main:main||MODELS().main,lite:lite||MODELS().lite};
}
function b64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function gemini(input,opts={}){
  const key=KEY();if(!key)throw{code:"no_key"};
  let turns=typeof input==="string"?[{role:"user",content:input}]:input.slice();
  let system="";if(turns.length>1&&turns[0].role==="user"&&turns[0].content===RULES){system=RULES;turns=turns.slice(1)}
  const contents=[];
  for(const t of turns){const role=t.role==="assistant"?"model":"user";const last=contents[contents.length-1];
    if(last&&last.role===role)last.parts[0].text+="\n\n"+t.content;else contents.push({role,parts:[{text:t.content}]})}
  if(contents[0]?.role!=="user")contents.unshift({role:"user",parts:[{text:"Ciao"}]});
  const imgs=opts.images?[].concat(...[opts.images].map(x=>x instanceof FileList?[...x]:x)):[];
  for(const f of imgs)contents[contents.length-1].parts.push({inline_data:{mime_type:f.type||"image/jpeg",data:await b64(f)}});
  const m=MODELS(),model=opts.modelTier==="quick"?m.lite:m.main;
  const body={contents,generationConfig:{maxOutputTokens:opts.modelTier==="quick"?8192:32768,temperature:.7}};
  if(system)body.systemInstruction={parts:[{text:system}]};
  let r;
  try{r=await fetch(API+"models/"+model+":streamGenerateContent?alt=sse&key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:opts.signal})}
  catch(e){throw{code:e?.name==="AbortError"?"cancelled":"upstream_error"}}
  if(!r.ok){let msg="";try{msg=(await r.json())?.error?.message||""}catch{}
    if(r.status===429)throw{code:"rate_limited",message:msg};
    if(r.status===400&&/api key/i.test(msg)||r.status===403)throw{code:"bad_key",message:msg};
    if(r.status===404){LS.set("minerva_m_main",null);LS.set("minerva_m_lite",null);throw{code:"model_missing",message:msg}}
    if(r.status===400&&/token|too large|exceeds/i.test(msg))throw{code:"prompt_too_large"};
    throw{code:"upstream_error",message:msg}}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="",text="",finish="";
  try{
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let nl;while((nl=buf.indexOf("\n"))>=0){const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line.startsWith("data:"))continue;let j;try{j=JSON.parse(line.slice(5))}catch{continue}
        const c=j.candidates?.[0];if(j.promptFeedback?.blockReason)throw{code:"refused"};
        const add=arr(c?.content?.parts).filter(p=>!p.thought&&p.text).map(p=>p.text).join("");
        if(c?.finishReason)finish=c.finishReason;
        if(add){text+=add;opts.onText?.({text,delta:add})}}}
  }catch(e){if(e?.code)throw {...e,text};throw{code:e?.name==="AbortError"?"cancelled":"upstream_error",text:text||undefined}}
  if(["SAFETY","PROHIBITED_CONTENT","BLOCKLIST"].includes(finish)&&!text)throw{code:"refused"};
  if(!text.trim())throw{code:"empty_completion"};
  return {text,truncated:finish==="MAX_TOKENS"};
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function md(t){
  const out=[];let list=null,code=null;const close=()=>{if(list){out.push("</"+list+">");list=null}};
  for(const raw of t.split("\n")){const l=raw.trimEnd();let m;
    if(l.startsWith("```")){if(code===null){close();code=[]}else{out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");code=null}continue}
    if(code!==null){code.push(raw);continue}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push("<li>"+inline(m[1])+"</li>");continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push("<li>"+inline(m[1])+"</li>");continue}
    close();if(!l.trim())continue;
    if((m=l.match(/^#{1,4}\s+(.*)/))){out.push("<h3>"+inline(m[1])+"</h3>");continue}
    if((m=l.match(/^>\s*(.*)/))){out.push('<div class="final">'+inline(m[1])+"</div>");continue}
    out.push("<p>"+inline(l)+"</p>");
  }
  close();if(code!==null)out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");return out.join("");
}

      const {text:ans,truncated}=await s(input,opts);
      body.insertAdjacentHTML("afterend",'<svg class="mark" aria-hidden="true"><use href="#owl"/></svg>');
      followRow(d,"text",[ib("i-copy","Copia",async()=>{try{await navigator.clipboard.writeText(ans);toast("Copiato")}catch{toast("Copia non disponibile qui: tieni premuto sul testo per selezionarlo")}}),
        ib("i-retry","Rigenera",()=>{turns.splice(-2,2);ask(text,t,img)})]);
      turns.push({role:"user",content:userText},{role:"assistant",content:ans});
      if(truncated)d.append(h("p","tip","Risposta tagliata: scrivi «continua»."));
    }
  }catch(e){
    bm.stop();
    if(e?.code==="cancelled"){if(!e.text)d.remove();else{body.className="body prose";body.innerHTML=md(e.text)}}
    else{
      if(e?.text&&!TOOLS[t].art){body.className="body prose";body.innerHTML=md(e.text);turns.push({role:"user",content:userText},{role:"assistant",content:e.text})}
      else body.innerHTML="";
      body.append(errBox(ERR[e?.code]||"Problema di connessione.",e?.code,()=>{d.remove();thread.lastElementChild?.classList.contains("user")&&thread.lastElementChild.remove();ask(text,t,img)}));
    }
  }finally{busy=false;ctl=null;send.classList.remove("stop");send.innerHTML="";send.append(icon("i-up"));send.setAttribute("aria-label","Invia");scroll()}
}
function errBox(msg,code,retry){
  const e=h("div","err");e.append(h("span",null,msg));
  if(retry){const b=h("button",null,"Riprova");b.type="button";b.onclick=retry;e.append(b)}
  if(code)e.append(h("small",null,code));return e;
}

/* ===== composer ===== */
function setPhoto(f){photo=f;$("#thumb").src=URL.createObjectURL(f);$("#attach").hidden=false;q.focus()}
function clearPhoto(){photo=null;$("#attach").hidden=true;$("#file").value=""}
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(f)setPhoto(f)});
$("#unattach").onclick=clearPhoto;
function autosize(){q.style.height="auto";q.style.height=Math.min(q.scrollHeight,200)+"px"}
q.addEventListener("input",autosize);
q.addEventListener("paste",e=>{if($("#photoBtn").hidden)return;const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));const f=it?.getAsFile();if(f)setPhoto(f)});
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();$("#form").requestSubmit()}});
$("#form").addEventListener("submit",e=>{e.preventDefault();if(busy){ctl?.abort();return}ask(q.value)});
$("#toolBtn").onclick=e=>{e.stopPropagation();toolsMenu()};
$("#settingsBtn").onclick=()=>settings();
if(!KEY())setTimeout(()=>settings(true),300);
else discoverModels(KEY()).catch(()=>{});
$("#newchat").onclick=()=>{ctl?.abort();turns=[];clearPhoto();$("#panel").hidden=true;setTool("auto");emptyState()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.querySelector(".menu")?.remove();if(!document.fullscreenElement&&!$("#panel").hidden)$("#panel").hidden=true}});
setTool("auto");emptyState();
</script>
